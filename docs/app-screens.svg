<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Pantallas principales del Gestor de Tareas ICE</title>
  <desc id="desc">Wireframe SVG basado en Material UI con layout principal, listado de tareas, formulario, panel IA y resumen confirmado.</desc>

  <defs>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f5f5f5; }
      .surface { fill: #ffffff; }
      .primary { fill: #1976d2; }
      .primary-dark { fill: #1565c0; }
      .secondary { fill: #2e7d32; }
      .warning { fill: #ed6c02; }
      .error { fill: #d32f2f; }
      .outline { stroke: #d6d9de; stroke-width: 1; fill: none; }
      .divider { stroke: #e0e0e0; stroke-width: 1; }
      .text { fill: #1f2937; font-family: Arial, sans-serif; }
      .muted { fill: #667085; font-family: Arial, sans-serif; }
      .inverse { fill: #ffffff; font-family: Arial, sans-serif; }
      .label { fill: #1976d2; font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .h1 { font-size: 20px; font-weight: 700; }
      .h2 { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
      .chip { font-size: 10px; font-weight: 700; }
      .button { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="960" class="bg"/>
  <text x="40" y="42" class="text h1">Gestor de Tareas ICE - Estructura funcional y visual</text>
  <text x="40" y="66" class="muted body">Referencia UX para React + Material UI. Pantallas y estados principales del MVP.</text>

  <!-- Screen 1: Layout principal -->
  <g transform="translate(40 100)">
    <text x="0" y="-18" class="text h2">1. TaskDashboardScreen</text>
    <rect x="0" y="0" width="420" height="330" rx="8" class="surface" filter="url(#shadow-sm)"/>
    <rect x="0" y="0" width="420" height="56" rx="8" class="primary"/>
    <rect x="0" y="48" width="420" height="8" class="primary"/>
    <text x="20" y="35" class="inverse h2">ICE Tasks</text>
    <circle cx="374" cy="28" r="15" fill="#ffffff" opacity="0.22"/>
    <text x="369" y="33" class="inverse button">+</text>

    <rect x="20" y="78" width="180" height="40" rx="4" class="primary"/>
    <text x="48" y="103" class="inverse button">Crear tarea</text>
    <rect x="214" y="78" width="126" height="40" rx="4" fill="#ffffff" stroke="#1976d2"/>
    <text x="232" y="103" class="label">Ordenar ICE</text>

    <rect x="20" y="142" width="380" height="66" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
    <text x="38" y="168" class="text body" font-weight="700">Preparar presentacion</text>
    <text x="38" y="190" class="muted small">Pendiente - ICE 14 - Prioridad media</text>
    <rect x="306" y="157" width="70" height="24" rx="12" fill="#fff4e5"/>
    <text x="321" y="173" class="warning chip">MEDIA</text>

    <rect x="20" y="222" width="380" height="66" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
    <text x="38" y="248" class="text body" font-weight="700">Revisar backlog</text>
    <text x="38" y="270" class="muted small">En progreso - Sin priorizar</text>
    <rect x="292" y="237" width="84" height="24" rx="12" fill="#eeeeee"/>
    <text x="305" y="253" class="muted chip">SIN ICE</text>

    <rect x="340" y="270" width="44" height="44" rx="22" class="primary" filter="url(#shadow-sm)"/>
    <text x="356" y="298" class="inverse h2">+</text>
  </g>

  <!-- Screen 2: Task list detail -->
  <g transform="translate(510 100)">
    <text x="0" y="-18" class="text h2">2. TaskListSection y TaskCard</text>
    <rect x="0" y="0" width="390" height="330" rx="8" class="surface" filter="url(#shadow-sm)"/>
    <text x="22" y="34" class="text h2">Tareas</text>
    <text x="22" y="56" class="muted small">Listado en memoria local</text>
    <line x1="0" y1="72" x2="390" y2="72" class="divider"/>

    <rect x="22" y="94" width="346" height="92" rx="8" fill="#ffffff" stroke="#d6d9de"/>
    <text x="40" y="121" class="text body" font-weight="700">Preparar presentacion</text>
    <text x="40" y="143" class="muted small">Crear una presentacion para explicar el producto.</text>
    <rect x="40" y="156" width="78" height="24" rx="12" fill="#e3f2fd"/>
    <text x="54" y="172" class="label">ICE 14</text>
    <rect x="128" y="156" width="78" height="24" rx="12" fill="#fff4e5"/>
    <text x="142" y="172" class="warning chip">MEDIA</text>
    <rect x="242" y="152" width="92" height="28" rx="4" fill="#ffffff" stroke="#d6d9de"/>
    <text x="257" y="170" class="muted small">Pendiente</text>

    <rect x="22" y="204" width="346" height="92" rx="8" fill="#ffffff" stroke="#d6d9de"/>
    <text x="40" y="231" class="text body" font-weight="700">Llamar a cliente</text>
    <text x="40" y="253" class="muted small">Resolver dudas antes de la demo.</text>
    <rect x="40" y="266" width="76" height="24" rx="12" fill="#e8f5e9"/>
    <text x="55" y="282" class="secondary chip">ICE 20</text>
    <rect x="126" y="266" width="66" height="24" rx="12" fill="#e8f5e9"/>
    <text x="141" y="282" class="secondary chip">ALTA</text>
    <text x="304" y="281" class="error button">Eliminar</text>
  </g>

  <!-- Screen 3: Form dialog -->
  <g transform="translate(950 100)">
    <text x="0" y="-18" class="text h2">3. TaskFormDialog</text>
    <rect x="0" y="0" width="430" height="330" rx="8" class="surface" filter="url(#shadow-sm)"/>
    <text x="24" y="36" class="text h2">Crear tarea</text>
    <text x="24" y="58" class="muted small">Titulo y descripcion son obligatorios</text>
    <line x1="0" y1="76" x2="430" y2="76" class="divider"/>

    <rect x="24" y="100" width="382" height="54" rx="4" fill="#ffffff" stroke="#1976d2"/>
    <text x="38" y="96" class="label">Titulo</text>
    <text x="38" y="132" class="text body">Preparar presentacion</text>

    <rect x="24" y="178" width="382" height="78" rx="4" fill="#ffffff" stroke="#d6d9de"/>
    <text x="38" y="174" class="muted small">Descripcion</text>
    <text x="38" y="210" class="text body">Crear una presentacion para explicar</text>
    <text x="38" y="230" class="text body">el nuevo producto al equipo comercial.</text>

    <rect x="24" y="276" width="158" height="38" rx="4" class="primary"/>
    <text x="43" y="300" class="inverse button">Calcular ICE</text>
    <rect x="194" y="276" width="92" height="38" rx="4" fill="#ffffff" stroke="#d6d9de"/>
    <text x="220" y="300" class="muted button">Cancelar</text>
  </g>

  <!-- Screen 4: AI suggestion panel -->
  <g transform="translate(40 510)">
    <text x="0" y="-18" class="text h2">4. IceSuggestionPanel</text>
    <rect x="0" y="0" width="420" height="330" rx="8" class="surface" filter="url(#shadow-sm)"/>
    <rect x="22" y="22" width="376" height="48" rx="8" fill="#e3f2fd"/>
    <text x="42" y="52" class="label">Sugerencia ICE generada por IA</text>

    <rect x="30" y="94" width="104" height="78" rx="8" fill="#ffffff" stroke="#d6d9de"/>
    <text x="52" y="121" class="muted small">Impacto</text>
    <text x="68" y="154" class="text h1">8</text>

    <rect x="158" y="94" width="104" height="78" rx="8" fill="#ffffff" stroke="#d6d9de"/>
    <text x="178" y="121" class="muted small">Confianza</text>
    <text x="196" y="154" class="text h1">7</text>

    <rect x="286" y="94" width="104" height="78" rx="8" fill="#ffffff" stroke="#d6d9de"/>
    <text x="314" y="121" class="muted small">Esfuerzo</text>
    <text x="326" y="154" class="text h1">4</text>

    <text x="30" y="210" class="text body" font-weight="700">ICE sugerido: 14</text>
    <rect x="138" y="193" width="80" height="24" rx="12" fill="#fff4e5"/>
    <text x="153" y="209" class="warning chip">MEDIA</text>
    <text x="30" y="242" class="muted small">Motivo: alto impacto con esfuerzo moderado.</text>

    <rect x="30" y="274" width="126" height="38" rx="4" fill="#ffffff" stroke="#1976d2"/>
    <text x="52" y="298" class="label">Editar valores</text>
    <rect x="170" y="274" width="146" height="38" rx="4" class="primary"/>
    <text x="195" y="298" class="inverse button">Confirmar ICE</text>
  </g>

  <!-- Screen 5: Manual edit -->
  <g transform="translate(510 510)">
    <text x="0" y="-18" class="text h2">5. ManualIceFields</text>
    <rect x="0" y="0" width="390" height="330" rx="8" class="surface" filter="url(#shadow-sm)"/>
    <text x="24" y="36" class="text h2">Ajustar valores ICE</text>
    <text x="24" y="58" class="muted small">Valores entre 1 y 10</text>

    <text x="24" y="96" class="muted small">Impacto</text>
    <rect x="24" y="108" width="342" height="6" rx="3" fill="#e0e0e0"/>
    <rect x="24" y="108" width="274" height="6" rx="3" class="primary"/>
    <circle cx="298" cy="111" r="10" class="primary"/>
    <text x="340" y="116" class="text body">8</text>

    <text x="24" y="152" class="muted small">Confianza</text>
    <rect x="24" y="164" width="342" height="6" rx="3" fill="#e0e0e0"/>
    <rect x="24" y="164" width="240" height="6" rx="3" class="primary"/>
    <circle cx="264" cy="167" r="10" class="primary"/>
    <text x="340" y="172" class="text body">7</text>

    <text x="24" y="208" class="muted small">Esfuerzo</text>
    <rect x="24" y="220" width="342" height="6" rx="3" fill="#e0e0e0"/>
    <rect x="24" y="220" width="138" height="6" rx="3" class="primary"/>
    <circle cx="162" cy="223" r="10" class="primary"/>
    <text x="340" y="228" class="text body">4</text>

    <rect x="24" y="258" width="342" height="46" rx="8" fill="#fafafa" stroke="#d6d9de"/>
    <text x="44" y="286" class="text body" font-weight="700">ICE recalculado: 14 - Prioridad media</text>
  </g>

  <!-- Screen 6: Confirmed summary -->
  <g transform="translate(950 510)">
    <text x="0" y="-18" class="text h2">6. TaskConfirmedSummary</text>
    <rect x="0" y="0" width="430" height="330" rx="8" class="surface" filter="url(#shadow-sm)"/>
    <circle cx="215" cy="64" r="28" class="secondary"/>
    <path d="M202 64 l8 9 l19 -22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="118" class="text h2">Tarea confirmada</text>
    <text x="88" y="144" class="muted body">La tarea se ha guardado en la sesion actual.</text>

    <rect x="44" y="174" width="342" height="82" rx="8" fill="#fafafa" stroke="#d6d9de"/>
    <text x="64" y="204" class="text body" font-weight="700">Preparar presentacion</text>
    <text x="64" y="226" class="muted small">ICE 14 - Prioridad media - Pendiente</text>
    <rect x="64" y="238" width="74" height="24" rx="12" fill="#e3f2fd"/>
    <text x="78" y="254" class="label">IA usada</text>

    <rect x="110" y="278" width="210" height="38" rx="4" class="primary"/>
    <text x="148" y="302" class="inverse button">Volver al listado</text>
  </g>
</svg>
