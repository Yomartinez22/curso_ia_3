interface:
  display_name: "GitHub Issue State"
  short_description: "Move implementation issues between states"
  default_prompt: "Use $github-issue-state with issue 1 and doing."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP server for reading and updating issues"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"
